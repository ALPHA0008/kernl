[package]
name = "kernl-edge-evaluator"
version = "0.1.0"
edition = "2021"
description = "The Kernl reflexive evaluator as a stateless Rust binary (arc Part 11: edge-evaluator sidecar). Outcome-exact port of backend/runtime/evaluator.py, proven by differential testing."
license = "UNLICENSED"

[[bin]]
name = "kernl-eval"
path = "src/main.rs"

[lib]
name = "kernl_edge_evaluator"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = 3
